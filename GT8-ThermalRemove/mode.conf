# ══ 资源归属声明（v2.8）═══════════════════════════════════════
# 本模块独占以下资源，改动前先确认没有引入第二个写入方：
#   thermal_zone*/emul_temp、cooling_device*/cur_state（仅 UNLOCK_CDEV=1）、
#   cpufreq scaling_{max,min}_freq、kgsl-3d0 max_*、/proc/shell-temp、
#   /proc/oplus-votable/GAUGE_UPDATE、horae 服务、ORMS 服务、
#   patched/{thermal,extra} 的 bind mount
# 完整清单与理由见 common/functions.sh 顶部。
# ⚠ 不要与第二个温控类模块共存 —— 它们写的是同一批资源，「最后执行者获胜」，
#   故障表现为温控行为随机、亮度异常等难以复现的问题。
# ══════════════════════════════════════════════════════════════

# ── 运行模式 ────────────────────────────────────────────────
# MODE:
#   dynamic = 场景化（充电时自动恢复保护，其余时间移除温控）  ← 推荐
#   always  = 始终移除温控（激进，充电时也不保护）
#   off     = 全部关闭，等同原厂
MODE=dynamic

# dynamic 模式下：前台是游戏时是否也恢复保护
#   0 = 游戏时也移除温控（多数人的诉求）
#   1 = 游戏时保留原厂保护（更保守）
GAME_PROTECT=0

# ── v2.8.13 省电：把「检测周期」与「维护周期」拆开 ──────────────
# 主循环原本每 5 秒醒来做一次检测、每 30 秒跑一次「全量应用」—— 后者会把
# find + 逐文件 awk、逐核 sysfs_set、83 个温感的 cat、pidof 全套重跑一遍
# （一次 ≈177 次 fork），而状态没变时其中绝大多数步骤都是空转。
#
#   检测（5s，本项不动）  只做零 fork 的读取：配置变没变、是不是在充电。
#       这是**安全侧**响应 —— 插上充电器后要在 5 秒内恢复原厂温控保护，
#       把它降频等于延长保护生效的延迟，所以保持 5s 不变。
#   维护（120s，可调）    重放欺骗值 + 压制频率锁 + 补触控提权 + 校验挂载。
#
# 注：老版本的 RES_SPOOF_TICKS（按 tick 计）已由 MAINT_SECONDS 接替；
#     若你的配置里还留着它，会按 tick × 5s 折算成 MAINT_SECONDS，不会失效。
MAINT_SECONDS=120          # 完整维护周期（秒）；设 30 即回到 v2.8.12 的节奏
PERF_REFRESH_SECONDS=30    # 只做频率锁压制（reapply_perf）的周期（秒），
                           # 它零 fork（16 次 sysfs 读），0 = 只在维护时做
LOG_HEARTBEAT=12           # 欺骗重放日志：每 N 次维护记一条；0 = 只在条数变化时记
                           # （原来每 30s 一行，一天 2880 行内容几乎完全相同）

# ── v2.12.0 温度保险丝（安全兜底，建议保持开启）─────────────────
# 为什么需要：本模块唯一的其他安全网是 SoC 硬件结温保护（Tj）。always 模式下
#   连电池过温保护也一起移除了 —— 保险丝就是补这一层软件兜底。
# 原理：每 MAINT_SECONDS 采一轮关键温感的**真实温度**（不是伪装值）：
#   短暂写 emul_temp=0 → 读 temp → 立刻写回伪装值；越界即撤销欺骗、回原厂保护，
#   并在 FUSE_COOLDOWN 秒内拒绝重新移除温控（等机身真的凉下来）。
# 单位毫摄氏度（45000 = 45.0°C），0 = 关闭该路。默认值刻意保守。
FUSE_ENABLE=1              # 1 = 开启保险丝；0 = 完全关闭（不采样）
FUSE_TEMP_BATT=45000       # 电池温度上限（充电过温保护的关键一路）
FUSE_TEMP_SOC=80000        # SoC 结温相关上限
FUSE_TEMP_SKIN=46000       # 外壳/皮肤温度上限
FUSE_COOLDOWN=120          # 触发后多少秒内不再重新移除温控

# ── v2.12.0 开机自救 ────────────────────────────────────────
# 连续 N 次开机没有走到 boot-completed（崩溃 / 卡开机）→ 自动进入安全模式
# （撤销改写 + MODE=off），保证设备一定能进系统。恢复正常后用
# `sh action.sh dynamic` 重新启用（会自动清除安全模式标记）。
BOOT_FAIL_LIMIT=3          # 连续失败阈值；1 = 只要失败一次就安全模式
CONF_FORCE_TICKS=12        # 配置/列表缓存的强制刷新兜底（12×5s=60 秒）。
                           # `-nt` 只比 mtime 的**秒**，同一秒内的连续保存会漏检
                           # （WebUI 连点两个开关就是这种场景），所以需要兜底。
                           # 60 秒 = 漏检窗口与解析成本的折中：全量解析从一天
                           # 17280 次降到 1440 次，成本约 4 秒 CPU/天

# ── v2.10.0 日志分级 ──────────────────────────────────────────
# 四个级别（由低到高），只有 ≥ 本阈值的事件才写入日志：
#   debug  详细过程：每次挂载了哪个文件、冷却节点还原明细、校验详情等。
#          排查「为什么某个温感没被欺骗」时才需要，日常会显著增加日志量。
#   info   默认。正常的状态变更：启动/进入主循环、温控已移除/已恢复、
#          欺骗已应用/已撤销、校验通过、触控提权等。
#   warn   异常但可自愈：检测到冲突模块、校验未通过后已补应用、
#          重放失败提前重试等。
#   error  核心功能失效：欺骗补应用后仍为空（温度欺骗实际没生效）。
#
# 可写文字（debug/info/warn/error）或数字（0/1/2/3）；写错一律按 info 处理
# （宁多打日志，也不让日志静默消失）。
#
# 附带的性能收益：低于阈值的日志**连行都不拼**，连 `date` 这个外部命令都不执行
# （每条 DEBUG 在 info 阈值下的成本为零 fork）。
#
# 日志行格式：[MM-DD HH:MM:SS] [LVL] 正文
#   过滤示例：grep '\[WRN\]\|\[ERR\]' /data/adb/thermal_remove/thermal_remove.log
LOG_LEVEL=info

# ── v2.8：模块冲突自检 ──────────────────────────────────────────
# 安装期与运行时扫描 /data/adb/modules/*/module.prop，发现其他温控模块就告警。
# 已确认会争抢同一批资源的：thermal_horae_extreme（温控 Horae 统一控制）、
# extreme_gt（Extreme GT）、manyapps_moka（Moka）；此外名称或 ID 含
# thermal / 温控 / 散热 / 去温控 等关键词的会标为「疑似」，需自行确认。
# 只告警，既不阻断安装也不改动任何状态 —— 卸载哪一个由你决定。
#   安装期：刷机日志里直接提示
#   运行时：sh /data/adb/modules/realme-gt8-sukisu-thermal-remove/action.sh conflicts
#   WebUI ：状态卡下方（有冲突才显示）
CHECK_CONFLICTS=1

# ── v2.8.6：Tier C「按资源占用」扫描 ───────────────────────────
# 上面的自检只认身份（id / 名称关键词）。遇到没见过的模块就完全静默 ——
# 而「亮度异常」「参数莫名失效」常来自身份不相关、却往同一批资源上写的模块。
# 设为 1 会额外翻开第三方模块的 *.sh / *.prop / *.rc，查里面有没有出现
# emul_temp / thermal_zone / cooling_device / horae / sys_thermal 等资源关键字，
# 命中报 low 级「疑似」（只告警，不改动任何东西）。
# 有 IO 成本：安装期与 `sh action.sh conflicts` 会自动开启；
# 运行时主循环 5 秒一轮会放大开销，日常保持 0 即可。
# 排查疑难问题时临时开一次：改这里 → sh action.sh conflicts
SCAN_RESOURCES=0

# ── 核心手段（默认开启，来自 HORAE，相对成熟）──────────────────
# 归零 cooling_device / 解锁 CPU-GPU 频率上限（含 GPU INT_MAX）
UNLOCK_FREQ=1

# ── v2.8.13 功耗优化：GPU 解锁独立开关 + 频率甜点值 ──────────────
# 去温控最明显的发热/耗电来源是 GPU 满载（GPU 功耗近似 f³）。上面
# UNLOCK_FREQ=1 会同时解锁 CPU 和 GPU；这里给你两个单独的旋钮：
#
#   UNLOCK_GPU=0  → 完全不碰 GPU，只解锁 CPU。GPU 仍受原厂温控限频，
#                   发热/耗电显著下降，代价是 GPU 重载场景会掉帧。
#   GPU_MAX_CLK    → GPU 频率上限（Hz，与 devfreq available_frequencies 同单位）。
#                   默认 2147483647 = 不限制（原满血行为）。设「甜点值」
#                   （如 800000000 = 800MHz）可在性能与发热间折中：
#                   GPU 频率-功耗非线性，封顶 80% 频率往往只损失个位数 % 性能，
#                   却能省 30~40% GPU 功耗。
#   ⚠ 单位假设 Hz；kgsl 的 max_gpu_clk / max_clock_mhz 是 HORAE 继承的 legacy
#     接口，SM8750 上真正生效的可能是 devfreq（本模块三处都会写，取实际生效者）。
#     改完用 su 下 cat 三个节点 + cur_freq 确认频率真被压下来（见省电报告 §5）。
UNLOCK_GPU=1
GPU_MAX_CLK=2147483647

# 安装时生成的"温控配置改写"是否生效（sys_thermal* / game_thermal /
# QEGA / devices_config / charging_* 这一组 HORAE 成熟规则）
PATCH_THERMAL=1

# ── v2.3：亮度保护（默认开启）─────────────────────────────────
# 说明：v2.2 及更早版本会把所有 cooling_device 的 cur_state 强制写成 0，
#       其中包含显示/背光类冷却节点 —— 这会把屏幕亮度压到最低
#       （实机反馈：一直最暗，手动调亮亮一下又被压回去）。
#       欺骗生效时内核本就不会抬升 cur_state，归零属于冗余且有害的手段，故默认关闭。
UNLOCK_CDEV=0

# 即使开启 UNLOCK_CDEV，也永远跳过显示/亮度/背光/面板类冷却节点
DISPLAY_PROTECT=1

# ── v2.6：WebUI 是否读取「真实温度」────────────────────────────
# 欺骗生效时 thermal_zone/temp 读到的就是伪装值，要拿真实值必须
# 短暂写入 emul_temp=0。本模块的做法是：一次性把所有被欺骗的温感归零
# → 等一拍 → 统一读取 → 立刻写回。v2.8.1 起带「读数校验」：读到的值
# 必须与伪装值不同才算真实值，否则自动加长等待重试（80→320→800ms），
# 仍读不到就如实显示「--」，不会拿伪装值冒充真实值。
# 探测每轮结束立刻恢复伪装；万一中途被杀，下次探测会先自愈恢复标记，
# service.sh 的周期重放（≤30s）是最终兜底。不放心可设为 0，界面只显示伪装值。
SHOW_REAL_TEMP=1

# v2.8.1：真实温度探测的第一轮等待时长（毫秒）。
# 部分内核在 emul_temp 写 0 后需要更久才刷新读数，可适当调大（如 200），
# 但每轮暴露窗口也会相应变长，一般保持默认即可。
REAL_TEMP_DELAY_MS=80

# ── 附加手段（v2.2 起全部默认关闭）────────────────────────────
# 说明：v2.1 把下面这些默认打开，导致有用户反馈亮度被锁在最低。
# 现在改为逐项手动开启 —— 请一次只开一个，观察 10 分钟确认无异常再开下一个。

# 停用 thermal 相关 init 服务（Android 16 上停 Thermal HAL 可能影响温度上报）
# v2.9 起：本开关同时会对 realme/OPPO 的 perf 守护进程做 kill 兜底
#   （perfservice / vendor-oplus-hardware-performance-V1-service / oplus_sched 等
#   —— 它们是 init 用 exec 拉起的，ctl.stop 无效，只能按名 kill）。这些进程
#   读的是自有温度源、不走 emul_temp 欺骗路径，会实时压大核频率。
# ⚠ 副作用：杀掉后系统自带的「性能/均衡/省电」档位自动调节会失效；
#   且它们可能被 init 重新拉起（需配合周期重放）。默认关闭，按需开启并观察。
STOP_SERVICES=0

# OPPO/realme 私有 /proc/shell-temp 接口
# ⚠ 该接口与屏幕亮度直接相关，且 HORAE 写 0-9、Extreme GT 写 0-2，范围不明确。
#   出现亮度异常时务必保持 0
OPPO_SHELL_TEMP=0

# /proc/oplus-votable/GAUGE_UPDATE 强制写入（作用不明确）
OPPO_GAUGE=0

# 调用 OPPO HORAE 系统服务的 testmode（dumpsys horae testmode）
HORAE_TESTMODE=0

# 停用 OPPO ORMS 资源/温控管理服务
DISABLE_ORMS=0

# 触控服务提优先级（renice -19），改善跟手性
TOUCH_BOOST=1

# ── v2.8.8：inputflinger 线程级提权 ────────────────────────────
# 上面那一条只提了厂商触控守护进程，但事件分发其实在 inputflinger 进程的
# InputReader（读）/ InputDispatcher（分发）/ InputClassifier（手势）线程上。
# 这一项把这三个线程的 nice 调到 TOUCH_THREAD_NICE（-19），补上缺失的那半程。
#
# 刻意只用 nice（CFS 调度权重），不用 SCHED_FIFO / chrt，也不碰
# sched_rt_throttle_us —— 评审过的第三方模块正是「chrt -f -p 99 + 关 RT 节流」，
# 组合起来任一 RT 线程死循环就是整机硬卡死，只能长按电源。nice 没有这个风险，
# 且原值会被记下来，关开关或进程重启都能还原。
#
# 默认关闭：属于新手段，按本模块惯例先观察。想验证就开这一项，
# 用 su -c 'sh /data/adb/modules/realme-gt8-sukisu-thermal-remove/action.sh touch'
# 看三个线程的 nice 是否真的变成 -19，再看体感。
TOUCH_THREAD_BOOST=0
# 目标 nice 值（范围 -20~19，越小优先级越高）。-19 已接近最低，
# 想温和一点可以设 -10。改完 5 秒内生效。
TOUCH_THREAD_NICE=-19

# ── Extreme GT 引入的额外配置改写（默认关闭）───────────────────
# thermallevel_to_fps.xml / oppo_display_perf_list.xml / qapegameconfig.txt
# 其中 oppo_display_perf_list.xml 直接关系显示行为，亮度异常时保持 0
PATCH_EXTRA=0

# sys_thermal_control_config*.xml 若为加密/二进制（非明文 XML），是否整体替换
# 替换会让 OPPO 温控服务拿不到任何策略数据，可能引发不可预期行为
REPLACE_ENCRYPTED=0

# ── v2.8.7：/data/system 运行时副本快照 ─────────────────────────
# refresh_rate_config.xml 这类显示配置，系统会额外在 /data/system/ 维护一份
# 「运行时副本」，优先级高于分区里的原始文件。别的模块 sed -i 改坏它、
# 又没有 uninstall.sh 的话就再也回不去了 —— 这是刷新率/亮度异常最难查的成因。
# 本模块**不改写**这些副本（rateId 语义在不同模块里互相矛盾，盲改等于掷骰子），
# 但安装时会把它们快照一份到 /data/adb/thermal_remove/runtime_backup/。
# 快照刻意放在模块目录之外：卸载本模块后依然保留，随时可手动还原。
# 只在快照不存在时写入 —— 二次安装不会把「已经被改坏的版本」设成新基准。
# v2.8.11：同一开关也用来记录 oplus_vrr_config.json 里 hw_nit_limit 等字段的
# 原厂基线（vrr_baseline.list）—— 「非 0」不等于「被钳」，只有与基线不同才算。
# 查看：sh action.sh diag    还原：sh action.sh rr_restore
RUNTIME_SNAPSHOT=1

# ── v2.8.7：已知配置文件核对 ───────────────────────────────────
# 安装期扫一遍行业已知的 12 个温控/显示配置文件名，把「发现但未改写」的
# 登记到 patched/known.list，让漏项和第三方覆盖变成可见信息而不是静默。
# 仅为登记，不产生任何改写动作，保持 1 即可。
CHECK_KNOWN_CFG=1
