# ══ 场景预设：原厂 ═══════════════════════════════════════════
# PRESET_* 是元数据（列表/卡片展示用），其余行才是要写入的配置键。
# 预设只接管自己**声明了**的键，没写的键一律保持用户当前值（局部覆盖）。
# 预设永不接管 BLACKLIST —— 黑名单属于用户个性化设置，切档不该清空它。
PRESET_NAME=原厂
PRESET_ICON=⭕
PRESET_ORDER=10
PRESET_RISK=safe
PRESET_TAGS=关闭 可逆
PRESET_DESC=完全关闭本模块：撤销温度欺骗、卸载配置改写、还原所有被写过的 sysfs 节点与属性。行为等同未安装，随时可切回其他档。
MODE=off
