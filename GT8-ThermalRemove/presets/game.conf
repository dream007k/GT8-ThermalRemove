# ══ 场景预设：游戏满血 ═══════════════════════════════════════
# 定位：重载游戏档。连电池温感一起欺骗（性能最大化），GPU 不设上限，
#       并给 inputflinger 的三个输入线程提权（跟手性）。
# ⚠ 仍保持 dynamic：插上充电器会恢复原厂保护。充电中打游戏请留意机身温度。
PRESET_NAME=游戏满血
PRESET_ICON=🎮
PRESET_ORDER=30
PRESET_RISK=caution
PRESET_TAGS=高发热 性能
PRESET_DESC=重载游戏：连电池温感一起欺骗、GPU 不设上限、并给 inputflinger 输入线程提权（跟手性更好）。机身温度会明显更高；充电打游戏时电池过温保护失效，只剩硬件熔断兜底。

# ── 运行模式 ──
MODE=dynamic
GAME_PROTECT=0

# ── 欺骗范围与强度 ──
SPOOF_BATT=1
SOC_T=29500
SKIN_T=29500
CAM_T=29500
BATT_T=29500
SHELL_PROC_T=29500

# ── 频率 / GPU ──
UNLOCK_FREQ=1
UNLOCK_GPU=1
GPU_MAX_CLK=2147483647

# ── 配置改写 ──
PATCH_THERMAL=1
PATCH_EXTRA=0

# ── 附加手段 ──
TOUCH_BOOST=1
TOUCH_THREAD_BOOST=1
UNLOCK_CDEV=0
DISPLAY_PROTECT=1
STOP_SERVICES=0
DISABLE_ORMS=0
OPPO_SHELL_TEMP=0
OPPO_GAUGE=0
HORAE_TESTMODE=0

# ── 可观测性 ──
LOG_LEVEL=info
