# ══ 场景预设：日用均衡（推荐）════════════════════════════════
# 定位：日常主力档。去温控但不骗电池（保留充电过温保护），CPU/GPU 满频，
#       只开触控加速这一项附加手段 —— 与模块出厂默认值一致。
PRESET_NAME=日用均衡
PRESET_ICON=⚖
PRESET_ORDER=20
PRESET_RISK=safe
PRESET_TAGS=推荐 日常
PRESET_DESC=日常推荐：场景化去温控，充电时自动恢复原厂保护；不欺骗电池温感，因此充电过温保护仍在；CPU/GPU 满频，附加手段只留触控加速。

# ── 运行模式 ──
MODE=dynamic
GAME_PROTECT=0

# ── 欺骗范围与强度 ──
SPOOF_BATT=0
SOC_T=29500
SKIN_T=29500
CAM_T=29500
BATT_T=29500
SHELL_PROC_T=29500

# ── 频率 / GPU ──
UNLOCK_FREQ=1
UNLOCK_GPU=1
GPU_MAX_CLK=2147483647

# ── 配置改写 ──
PATCH_THERMAL=1
PATCH_EXTRA=0

# ── 附加手段（逐项明确，避免被上一档的残留影响）──
TOUCH_BOOST=1
TOUCH_THREAD_BOOST=0
UNLOCK_CDEV=0
DISPLAY_PROTECT=1
STOP_SERVICES=0
DISABLE_ORMS=0
OPPO_SHELL_TEMP=0
OPPO_GAUGE=0
HORAE_TESTMODE=0

# ── 可观测性 ──
LOG_LEVEL=info
