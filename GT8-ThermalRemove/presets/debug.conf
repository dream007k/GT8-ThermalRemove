# ══ 场景预设：排障 ═══════════════════════════════════════════
# 定位：诊断档。**刻意只接管 3 个键** —— 不动运行模式、不动欺骗范围、
#       不动频率策略，因此它可以在任何状态下安全叠加：
#         ① 日志级别调到 debug（记下每一步挂载、每个温感的分类与写入结果）
#         ② 打开冲突自检
#         ③ 打开「按资源占用」扫描（会读第三方模块的 *.sh/*.prop/*.rc，
#            用于抓「身份不相关却写同一批资源」的模块）
# ⚠ ③ 有 IO 成本，主循环 5 秒一轮会放大开销 —— 排障完务必切回其他档。
PRESET_NAME=排障
PRESET_ICON=🔍
PRESET_ORDER=90
PRESET_RISK=caution
PRESET_TAGS=诊断 不改行为
PRESET_DESC=不改运行模式与任何开关，只把日志级别调到 debug 并打开模块冲突的资源占用扫描。适合定位「参数莫名失效」「亮度异常」这类找不到来源的问题。扫描有 IO 成本，排查完请切回其他档。

# ── 只接管可观测性相关的 3 个键（局部覆盖的最小示例）──
LOG_LEVEL=debug
CHECK_CONFLICTS=1
SCAN_RESOURCES=1
