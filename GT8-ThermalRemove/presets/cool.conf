# ══ 场景预设：降温优先 ═══════════════════════════════════════
# 定位：功耗/发热敏感档。CPU 去温控保住流畅度，但**不解锁 GPU** ——
#       GPU 继续受原厂温控管辖，重载时会自动降频，换来更低的机身温度。
#       附加手段全关（含触控加速），把非必要的写入降到最少。
# 代价：GPU 重载场景（高画质游戏、渲染、AI）会出现掉帧。
PRESET_NAME=降温优先
PRESET_ICON=❄
PRESET_ORDER=40
PRESET_RISK=safe
PRESET_TAGS=省电 低发热
PRESET_DESC=想少发热：CPU 去温控保住流畅度，但 GPU 交给原厂温控（不解锁），重载时 GPU 会自动降频换取更低的机身温度；附加手段全部关闭。代价是 GPU 重载场景掉帧。

# ── 运行模式 ──
MODE=dynamic
GAME_PROTECT=0

# ── 欺骗范围与强度 ──
SPOOF_BATT=0
SOC_T=29500
SKIN_T=29500
CAM_T=29500
BATT_T=29500
SHELL_PROC_T=29500

# ── 频率 / GPU：这是本档与日用档的核心差别 ──
UNLOCK_FREQ=1
UNLOCK_GPU=0
GPU_MAX_CLK=2147483647

# ── 配置改写 ──
PATCH_THERMAL=1
PATCH_EXTRA=0

# ── 附加手段：全关，减少非必要写入 ──
TOUCH_BOOST=0
TOUCH_THREAD_BOOST=0
UNLOCK_CDEV=0
DISPLAY_PROTECT=1
STOP_SERVICES=0
DISABLE_ORMS=0
OPPO_SHELL_TEMP=0
OPPO_GAUGE=0
HORAE_TESTMODE=0

# ── 可观测性 ──
LOG_LEVEL=info
