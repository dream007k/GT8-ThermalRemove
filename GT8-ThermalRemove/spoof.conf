# ── 欺骗温度（单位：毫摄氏度，29500 = 29.5°C）────────────────
# 温控引擎读到这些假温度后，达不到任何阈值，因此不会限频。

# SoC / 主板 / 射频类温感
SOC_T=29500

# 外壳 / 皮肤温度
# v2.3：从 33000 下调到 29500。注入高于真实的皮肤温度反而会触发厂商的
#   "温热降亮度 / 退出高亮模式"策略，冷机时表现为亮度被钳在最低
SKIN_T=29500

# 相机相关温感（相机温控最保守，最容易掉帧）
CAM_T=29500

# 电池 / USB 温感
BATT_T=29500

# 是否欺骗电池温度：
#   1 = 欺骗（默认）
#   0 = 不欺骗（电池温控同时承担充电过温保护，更稳妥）
# 注意：dynamic 模式下充电时会自动跳过；always 模式请自行承担充电过温风险
#       （硬件级熔断仍会兜底）
SPOOF_BATT=1

# /proc/shell-temp 写入值（OPPO 私有外壳温度接口）
# HORAE 与 Extreme GT 均使用 29500（29.5°C）
SHELL_PROC_T=29500

# ── 不参与欺骗的温感（按 type 名匹配，支持通配符）─────────────
# 默认排除显示/面板/环境光相关温感：
#   这类温感可能参与亮度调节与自动亮度，欺骗它们有把亮度压到最低的风险
#   （2026-10-03 反馈：亮度被锁在最低，疑似与此相关，故加入默认黑名单）
BLACKLIST="*disp* *display* *panel* *lcd* *oled* *amb* *light* *als* *backlight* *bright* *screen*"
